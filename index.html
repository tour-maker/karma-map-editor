    <meta property="og:type" content="website" />
    <meta property="og:title" content="Karma Map Editor — Interactive Real Estate & Property Mapping Tool" />
    <meta property="og:description" content="Interactive map editor for viewing, editing, matching, and managing real estate property polygons, landmarks, and spatial analytics." />
